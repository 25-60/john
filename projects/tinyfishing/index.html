<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page iframe</title>
    <style>
        /* Remove default spacing around the browser edge */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        .full-page-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe class="full-page-iframe" src="https://htmlxm.github.io/h/tiny-fishing/" scrolling="none" frameborder="0" allowfullscreen></iframe>
    <!--<iframe class="game-iframe" id="game-area" src="https://htmlxm.github.io/h/tiny-fishing/" width="480" height="800" scrolling="none" frameborder="0" allowfullscreen></iframe> -->
</body>
</html>
